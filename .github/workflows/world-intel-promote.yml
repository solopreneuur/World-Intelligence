name: World Intel Promote

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: world-intel
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'promotions')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Save the reply
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          mkdir -p .claude/logs
          printf '%s' "$COMMENT_BODY" > .claude/logs/approval-reply.txt

      - name: Promote approved trends
        run: |
          claude -p "/world-intel-promote-auto" \
            --permission-mode acceptEdits \
            --permission-prompts none > .claude/logs/run.log 2>&1 || true

      - name: Commit trend notes
        run: |
          git config user.name "world-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "World Intel promotions $(date +%F)"
          git pull --rebase
          git push

      - name: Report back
        if: always()
        run: |
          R=".claude/logs/promote-result.md"
          if [ -s "$R" ]; then
            gh issue comment "$ISSUE" --body-file "$R"
            grep -q '^STATUS: done' "$R" && gh issue close "$ISSUE" || true
          else
            gh issue comment "$ISSUE" --body "Promotion run failed. Nothing was written. Check the Actions log."
          fi
